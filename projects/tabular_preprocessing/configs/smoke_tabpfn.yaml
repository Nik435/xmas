# The smoke test (configs/smoke.yaml) with TabPFN v2 as the predictor: checks the GPU setup.
#   sbatch -p ml_gpu-rtx2080 --gres=gpu:1 cluster/test_job.sh configs/smoke_tabpfn.yaml

name: smoke_tabpfn
output_dir: runs/smoke_tabpfn
repeats: 1

optimizer:
  name: grid
objective: mean_relative_improvement   # per task (score - identity) / |identity|, then the mean

tasks:
  - rel-f1/driver-dnf

architecture:
  codes: ["clean=E|merge=E"]

factors:
  orchestrator: off
  temperature: 0.25
  models:
    default: gemma-4-31b-llmlb   # set the model your endpoint serves
  tool_description: detailed
  autonomy: bounded
  order: clean_first
  merge_fills_sample: no

budgets:
  bounded: {max_tool_rounds: 15, max_loops: 2, max_evaluations: 10, max_steps: 8}

run:
  predictor: tabpfn_v2
  max_rows: 10000
  max_columns: 500
  baseline: true
  max_train_rows: null   # e.g. 50000: keep only the most recent training label rows (rel-stack, rel-hm)
  retries: 2             # a run that fails on API errors is retried; if it still fails, the trial is redone later
  parallel: 1            # runs of a trial at the same time
  max_tokens: null       # stop the study after this many tokens
  max_hours: null        # ... or after this many hours of runs
