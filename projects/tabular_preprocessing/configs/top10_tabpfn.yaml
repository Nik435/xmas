# TabPFN v2 for a real comparison with RDBLearn (DFS features + TabPFN v2): the 10 best
# architectures of grid81_v3 (by search value) plus the single agent (solo), 3 repeats each, on the
# 20 RelArena entity tasks (all but rel-amazon/item-ltv). Toolset, factors and limits as in
# grid81_v3; only the predictor and the tasks change. Every system and every baseline (identity,
# entity_table, dfs = RDBLearn's default config) uses TabPFN v2 with 10,000 training rows per fit.
#
# The architectures were chosen on grid81_v3's 10 tasks: the 10 tasks new here are a fresh check of
# that choice. TabPFN runs on the CPU partition with 16 cores per job (start_grid.sh asks for them).
#
#   CONFIG=configs/top10_tabpfn.yaml bash cluster/start_grid.sh
#
# Tasks run in this order inside each job, the biggest databases last (rel-stack, then rel-hm):
# if those crash, every other task is already done.

name: top10_tabpfn
output_dir: runs/top10_tabpfn
repeats: 3

optimizer:
  name: grid
objective: mean_relative_improvement

tasks:
  - rel-f1/driver-position
  - rel-f1/driver-dnf
  - rel-f1/driver-top3
  - rel-amazon/user-churn
  - rel-amazon/user-ltv
  - rel-amazon/item-churn
  - rel-avito/ad-ctr
  - rel-avito/user-visits
  - rel-avito/user-clicks
  - rel-trial/study-outcome
  - rel-trial/study-adverse
  - rel-trial/site-success
  - rel-event/user-attendance
  - rel-event/user-repeat
  - rel-event/user-ignore
  - rel-stack/user-engagement
  - rel-stack/post-votes
  - rel-stack/user-badge
  - rel-hm/user-churn
  - rel-hm/item-sales

architecture:
  codes:  # the 10 best of grid81_v3, then the single agent
    - "clean=PEV-VE|merge=PEV"  # v3 rank 1, value 0.3449
    - "clean=PE|merge=PEV"  # v3 rank 2, value 0.3418
    - "clean=PEV-EP|merge=PE-EP"  # v3 rank 3, value 0.3418
    - "clean=PE-EP|merge=PEV-EP"  # v3 rank 4, value 0.3409
    - "clean=PE|merge=PEV-VE"  # v3 rank 5, value 0.3409
    - "clean=E|merge=PEV"  # v3 rank 6, value 0.3403
    - "clean=PE|merge=PE-EP"  # v3 rank 7, value 0.3400
    - "clean=EV|merge=PEV"  # v3 rank 8, value 0.3397
    - "clean=PE|merge=PE"  # v3 rank 9, value 0.3394
    - "clean=PEV-EP|merge=PEV"  # v3 rank 10, value 0.3389
    - "solo"  # v3 rank 47, value 0.3276

factors:
  orchestrator: off
  temperature: 0.25
  models:
    default: gemma-4-31b-llmlb
  tool_description: detailed
  autonomy: bounded
  order: clean_first
  merge_fills_sample: no

run:
  predictor: tabpfn_v2  # RDBLearn's default model
  max_rows: 10000  # rows per fit: TabPFN v2's pretraining limit, as in RDBLearn
  max_columns: 500
  max_train_rows: 50000  # the most recent label rows (rel-hm and rel-stack have millions)
  baseline: true
  retries: 2
  parallel: 1
